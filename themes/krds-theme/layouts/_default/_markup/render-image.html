{{- $src := .Destination -}}
{{- $src = replaceRE `^\./(?:\.\./)*images/` (print .Page.CurrentSection.RelPermalink "images/") $src 1 -}}
{{- $safeSrc := $src | safeURL -}}
<img src="{{ $safeSrc }}" alt="{{ .Text }}" {{ with .Title }}title="{{ .Text }}"{{ end }} >
